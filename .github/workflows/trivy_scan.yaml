name: Trivy Scan
on:
  push:
    branches: [ '*' ]
    paths-ignore:
      - 'atomfeed-console/**'
      - '.github/workflows/atomfeed_console_build_publish.yaml'
      - "core/**"
      - 'bahmni-pacs/**'
      - '.github/workflows/dcm4chee_build_publish.yml'
      - 'bahmni-proxy/**'
  pull_request:
    branches: [ '*' ]
    types: [opened, synchronize, reopened]


jobs:
  Trivy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Trivy Scan
        run: |
          wget -q https://raw.githubusercontent.com/Bahmni/bahmni-infra-utils/main/trivy_scan.sh && chmod +x trivy_scan.sh
          ./trivy_scan.sh
          rm trivy_scan.sh
